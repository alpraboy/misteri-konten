# Konfigurasi 3 tema misteri (gaya: komik tinta hitam-putih + satu warna aksen).
# Warna ASS memakai format &HBBGGRR& (biru-hijau-merah).

sejarah:
  label: "Sejarah Misteri"
  source: wikipedia            # fakta diambil dari Wikipedia agar tidak mengarang
  voice: id-ID-ArdiNeural
  rate: "-10%"
  tone: >
    Narator dokumenter yang tenang dan berwibawa. Fokus pada fakta sejarah yang
    belum terjawab, teori yang beredar, dan apa yang masih menjadi tanda tanya.
  topic_hint: "misteri sejarah yang belum terpecahkan"
  regions: ["Nusantara", "Indonesia", "Eropa", "Mesir kuno", "Asia", "Amerika", "Timur Tengah"]
  disclaimer: "Ringkasan dari sumber terbuka; sebagian masih teori dan belum terbukti."
  style:
    font: "DejaVu Serif"
    size: 74
    title_size: 64
    color: "&H0000B0FF&"       # aksen amber (kata aktif + kotak judul)
    accent_prompt: "amber orange"
    uppercase: false
    flicker: false
    grade: "eq=contrast=1.05,vignette=PI/4"
  fallback_keywords: ["ancient ruins fog", "old map parchment", "dark old library", "stone temple mist"]

cerita:
  label: "Cerita Misteri"
  source: none                 # fiksi / legenda, wajib diberi label di caption
  voice: id-ID-ArdiNeural
  rate: "-10%"
  tone: >
    Pencerita horor-misteri yang pelan dan menegangkan. Bangun suasana, beri
    plot twist di akhir. Boleh legenda/cerita rakyat atau cerita orisinal.
  topic_hint: "legenda atau cerita misteri yang menyeramkan"
  regions: ["Jawa", "Sumatra", "Kalimantan", "Sulawesi", "Eropa", "Jepang", "Amerika"]
  disclaimer: "Ini kisah/legenda/fiksi untuk hiburan, bukan fakta."
  style:
    font: "Montserrat"
    size: 80
    title_size: 62
    color: "&H003C14DC&"       # aksen merah darah
    accent_prompt: "crimson red"
    uppercase: true
    flicker: false             # tanpa kedipan agar nyaman ditonton
    grade: "eq=contrast=1.08:brightness=-0.03,vignette=PI/3.2"
  fallback_keywords: ["dark foggy forest night", "abandoned house night", "candle dark room", "moon clouds night"]

berita:
  label: "Berita Misteri"
  source: news                 # judul dari Google News RSS, bukan karangan model
  voice: id-ID-GadisNeural
  rate: "-6%"
  tone: >
    Pembawa berita yang lugas dan netral. Pakai kata "dilaporkan", "menurut
    pemberitaan", "belum dapat dipastikan". Jangan menuduh orang tertentu.
  topic_hint: "misteri OR fenomena aneh OR belum terpecahkan"
  news_window: "7d"
  disclaimer: "Berdasarkan pemberitaan media; belum tentu terverifikasi. Cek sumber aslinya."
  style:
    font: "Montserrat"
    size: 76
    title_size: 60
    color: "&H00A4B300&"       # aksen teal
    accent_prompt: "teal cyan"
    uppercase: true
    flicker: false
    grade: "eq=contrast=1.05,vignette=PI/4.5"
  fallback_keywords: ["city night street", "newsroom", "police lights night", "dark sky clouds"]
