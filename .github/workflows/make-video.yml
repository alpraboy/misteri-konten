name: Buat Video Misteri

on:
  workflow_dispatch:
    inputs:
      theme:
        description: "Tema isi konten"
        type: choice
        options: [sejarah, cerita, berita, horor_nusantara, legenda_urban, kasus_tak_terpecahkan, ufo_uap, kriptid, tempat_angker, peradaban_hilang, artefak_terkutuk, fenomena_alam]
        default: horor_nusantara
      style:
        description: "Style editing (auto = agen memilih satu dari 3)"
        type: choice
        options: [auto, MYSTERY_VHS, MYSTERY_CONSPIRACY, MYSTERY_WAYANG]
        default: auto
      post:
        description: "Unggah otomatis sebagai private/draf? (butuh secret platform)"
        type: choice
        options: [ya, tidak]
        default: ya
      topic:
        description: "Topik (kosongkan agar agen memilih sendiri)"
        required: false
        default: ""
  # Jadwal harian DINONAKTIFKAN agar kuota tidak terpakai saat masih uji coba.
  # Untuk mengaktifkan (08:00 WIB), hapus tanda # pada 2 baris di bawah:
  # schedule:
  #   - cron: "0 1 * * *"

permissions:
  contents: write   # agar riwayat topik (data/history.json) bisa disimpan balik ke repo

concurrency:
  group: make-video   # satu proses sekali jalan, supaya riwayat topik tidak bentrok
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Pasang ffmpeg & font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-montserrat
          fc-cache -f

      - name: Pasang dependensi Python
        run: pip install -r requirements.txt

      - name: Uji unit pipeline
        run: python -m unittest discover -s tests -v

      - name: Buat video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          THEME: ${{ inputs.theme || 'horor_nusantara' }}
          STYLE: ${{ inputs.style || 'auto' }}
          TOPIC: ${{ inputs.topic }}
        run: python src/main.py --theme "$THEME" --style "$STYLE" --topic "$TOPIC"

      - name: Simpan riwayat topik (agar tidak diulang)
        continue-on-error: true
        run: |
          if [ ! -f data/history.json ]; then echo "Belum ada riwayat untuk disimpan."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          if git diff --cached --quiet; then echo "Riwayat tidak berubah."; exit 0; fi
          git commit -m "riwayat: tambah topik video"
          for i in 1 2 3; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && exit 0
            sleep 5
          done
          echo "::warning::Riwayat topik gagal disimpan ke repo; video berikutnya bisa mengulang topik ini."

      - name: Posting aman (private/draf)
        if: ${{ inputs.post != 'tidak' }}
        continue-on-error: true
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/publish.py output

      - name: Simpan hasil (unduh dari tab Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: output/
          retention-days: 14
