name: Buat Video Misteri

on:
  workflow_dispatch:
    inputs:
      theme:
        description: "Tema video"
        type: choice
        options: [sejarah, cerita, berita]
        default: sejarah
      topic:
        description: "Topik (kosongkan agar agen memilih sendiri)"
        required: false
        default: ""

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Pasang ffmpeg & font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-montserrat fonts-dejavu-core
          fc-cache -f

      - name: Pasang dependensi Python
        run: pip install -r requirements.txt

      - name: Buat video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          THEME: ${{ inputs.theme || 'sejarah' }}
          TOPIC: ${{ inputs.topic }}
        run: python src/main.py --theme "$THEME" --topic "$TOPIC"

      - name: Simpan hasil (unduh dari tab Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: output/
          retention-days: 14
